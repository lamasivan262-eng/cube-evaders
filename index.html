<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Evaders</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #111; font-family: 'Righteous', cursive; user-select: none;
        }

        canvas { display: block; width: 100vw; height: 100vh; }

        /* --- Global UI Container --- */
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; background: linear-gradient(to bottom, #1a2a6c, #112953, #0b132b);
        }

        .hidden { display: none !important; }

        h1 { color: #fff; font-size: 60px; text-shadow: 4px 4px 0px #000; margin-bottom: 20px; letter-spacing: 3px; text-align: center;}
        h2 { color: #fff; font-size: 30px; text-shadow: 2px 2px 0px #000; }

        /* --- Buttons --- */
        .btn {
            background-color: #FFB800; color: #000; border: 4px solid #fff; padding: 15px 40px;
            font-size: 24px; border-radius: 10px; cursor: pointer; font-family: 'Righteous', cursive;
            margin: 10px; box-shadow: 4px 4px 0px #000; transition: transform 0.1s;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 6px 6px 0px #000; }
        .btn:active { transform: translateY(2px); box-shadow: 2px 2px 0px #000; }
        .btn-green { background-color: #00FF00; }
        .btn-blue { background-color: #00FFFF; }
        .btn-red { background-color: #FF4444; color: white; }

        .menu-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;}

        /* --- Icon Kit --- */
        .color-picker { display: flex; flex-direction: column; align-items: center; margin: 20px; }
        input[type="color"] { width: 80px; height: 80px; border: 4px solid #fff; border-radius: 10px; cursor: pointer; }

        /* --- Game UI (Overlay) --- */
        #gameUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #progressBarBg {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; height: 24px;
            background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 12px; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #progressBarFill { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: #00FF00; transition: width 0.1s linear; z-index: 1;}
        #progressText { position: relative; z-index: 2; color: white; font-size: 16px; text-shadow: 1px 1px 0px #000; letter-spacing: 1px;}
        #attemptDisplay { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.8); text-shadow: 2px 2px 0px #000; font-size: 20px; }
        #coinDisplay { position: absolute; top: 20px; right: 20px; color: #FFD700; text-shadow: 2px 2px 0px #000; font-size: 24px; font-weight: bold; }

        /* --- Pause Menu Overlay --- */
        #pauseUI { background: rgba(0,0,0,0.85); z-index: 40; pointer-events: auto; }
        .mod-btn { background: #444; color: white; }

        /* --- Editor UI --- */
        #editorUI {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; width: 95%; max-width: 1200px;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 2px solid #fff; z-index: 30;
        }
        .tool-btn {
            background: #444; color: white; border: 2px solid #fff; padding: 6px 10px; font-family: 'Righteous'; cursor: pointer; border-radius: 5px; font-size: 13px;
        }
        .tool-btn.active { background: #00FF00; color: black; }
        .tool-category { border-left: 2px solid #777; padding-left: 10px; margin-left: 5px; display: flex; gap: 5px; align-items: center;}
        #editorControlsText {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: white; text-shadow: 2px 2px 0px #000; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; pointer-events: none; z-index: 30; text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="gameUI" class="hidden">
        <div id="progressBarBg">
            <div id="progressBarFill"></div>
            <div id="progressText">0%</div>
        </div>
        <div id="attemptDisplay">Attempt 1</div>
        <div id="coinDisplay">Coins: 0</div>
    </div>

    <div id="pauseUI" class="ui-screen hidden">
        <h1>PAUSED</h1>
        <div class="menu-row">
            <button class="btn btn-green" id="btnResume">Resume</button>
            <button class="btn btn-red" id="btnQuitFromPause">Quit to Menu</button>
        </div>
        <h2 style="margin-top: 40px; border-bottom: 2px solid white; padding-bottom: 5px;">MOD MENU</h2>
        <div class="menu-row">
            <button class="btn mod-btn" id="btnHackNoclip">Noclip: OFF</button>
            <button class="btn mod-btn" id="btnHackSlowmo">Slowmo: OFF</button>
        </div>
    </div>

    <!-- Code Import/Export Menu -->
    <div id="levelCodeUI" class="ui-screen hidden" style="z-index: 50; background: rgba(0,0,0,0.95);">
        <h1 id="levelCodeTitle">LEVEL CODE</h1>
        <textarea id="levelCodeInput" style="width: 80%; max-width: 800px; height: 200px; font-family: monospace; font-size: 16px; margin: 20px; padding: 10px; border-radius: 10px; border: 4px solid #fff; background: #222; color: #00FF00;"></textarea>
        <div class="menu-row">
            <button class="btn btn-green" id="btnConfirmLoad">Load Level</button>
            <button class="btn btn-blue" id="btnCopyCode">Copy Code</button>
            <button class="btn btn-red" id="btnCloseCodeUI">Close</button>
        </div>
    </div>

    <div id="editorUI" class="hidden">
        <button class="tool-btn active" data-tool="block">Block</button>
        <button class="tool-btn" data-tool="spike">Spike</button>
        <button class="tool-btn" data-tool="coin" style="color:#FFD700; border-color:#FFD700;">Coin</button>
        <button class="tool-btn" id="toolRotate" style="background:#8844FF; color:white;">Rotate: 0°</button>
        
        <div class="tool-category">
            <button class="tool-btn" data-tool="orb_yellow" style="color:#FFEB3B; border-color:#FFEB3B;">Orb Y</button>
            <button class="tool-btn" data-tool="pad_yellow" style="background:#FFEB3B; color:black;">Pad Y</button>
            <button class="tool-btn" data-tool="orb_pink" style="color:#FF66FF; border-color:#FF66FF;">Orb P</button>
            <button class="tool-btn" data-tool="pad_pink" style="background:#FF66FF; color:white;">Pad P</button>
        </div>

        <div class="tool-category">
            <button class="tool-btn" data-tool="portal_cube" style="background:#00FF00; color:black;">Cube</button>
            <button class="tool-btn" data-tool="portal_ship" style="background:#FF00FF; color:black;">Ship</button>
            <button class="tool-btn" data-tool="portal_ufo" style="background:#FF8800; color:black;">UFO</button>
            <button class="tool-btn" data-tool="portal_ball" style="background:#FFA500; color:black;">Ball</button>
            <button class="tool-btn" data-tool="portal_wave" style="background:#00FFFF; color:black;">Wave</button>
        </div>

        <div class="tool-category">
            <button class="tool-btn" data-tool="portal_grav_up" style="background:#FFEB3B; color:black;">Grav Up</button>
            <button class="tool-btn" data-tool="portal_grav_down" style="background:#0088FF; color:white;">Grav Down</button>
        </div>

        <div class="tool-category">
            <button class="tool-btn" data-tool="speed_normal" style="background:#4CAF50; color:white;">1x</button>
            <button class="tool-btn" data-tool="speed_fast" style="background:#E91E63; color:white;">2x</button>
        </div>

        <div class="tool-category">
            <button class="tool-btn" data-tool="eraser">Eraser</button>
            <button class="tool-btn" id="toolSave" style="background:#2196F3; color:white;">Save Code</button>
            <button class="tool-btn" id="toolLoad" style="background:#2196F3; color:white;">Load Code</button>
            <button class="tool-btn" id="toolClear" style="background:#FF4444; color:white;">Clear</button>
        </div>

        <div class="tool-category">
            <button class="tool-btn" style="background:#FFB800; color:black;" id="toolPlay">Play</button>
            <button class="tool-btn" style="background:#FF4444; color:white;" id="toolQuit">Menu</button>
        </div>
    </div>
    <div id="editorControlsText" class="hidden">L/R Arrows (Hold Shift for fast pan) to scroll. W/Space/Up to Jump! Escape to Pause.</div>

    <div id="mainMenu" class="ui-screen">
        <h1>CUBE EVADERS</h1>
        <div class="menu-row" style="margin-top: 40px;">
            <button class="btn btn-green" id="btnPlayMain">Play Campaign</button>
            <button class="btn btn-blue" id="btnEditor">Level Editor</button>
            <button class="btn" id="btnIconKit">Icon Kit</button>
        </div>
    </div>

    <div id="iconKitScreen" class="ui-screen hidden">
        <h1>ICON KIT</h1>
        <div class="menu-row">
            <div class="color-picker"><h2>Primary</h2><input type="color" id="color1" value="#FF00FF"></div>
            <div class="color-picker"><h2>Secondary</h2><input type="color" id="color2" value="#00FFFF"></div>
        </div>
        <button class="btn" id="btnBackFromIcons" style="margin-top: 40px;">Back to Menu</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const screens = { 
            menu: document.getElementById('mainMenu'), 
            iconKit: document.getElementById('iconKitScreen'), 
            game: document.getElementById('gameUI'), 
            editor: document.getElementById('editorUI'),
            pause: document.getElementById('pauseUI')
        };
        const editorText = document.getElementById('editorControlsText');
        const progressFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const attemptDisplay = document.getElementById('attemptDisplay');
        const coinDisplay = document.getElementById('coinDisplay');
        const rotateBtn = document.getElementById('toolRotate');
        
        // Level Code UI Elements
        const levelCodeUI = document.getElementById('levelCodeUI');
        const levelCodeInput = document.getElementById('levelCodeInput');
        const levelCodeTitle = document.getElementById('levelCodeTitle');
        const btnConfirmLoad = document.getElementById('btnConfirmLoad');
        const btnCopyCode = document.getElementById('btnCopyCode');

        const SIZE = 50; 
        const FLOOR_HEIGHT = 120;
        let GAME_SPEED = 11; 
        const LEVEL_PIXEL_LENGTH = 45000;

        let gameState = 'menu';
        let gameOver = false; let levelComplete = false;
        let attempts = 1; let distance = 0; let animationId;
        
        let screenShake = 0; let particles = []; let trailParticles = []; let bgOffset = 0;
        let editorCameraX = 0; let currentTool = 'block'; let currentRotation = 0;
        let customLevelData = []; let playingCustom = false; let activeObstacles = []; 
        let isHolding = false; let keys = {}; let jumpBufferFrames = 0;
        let coinsCollected = 0;

        let hacks = { noclip: false, slowmo: false };

        let player = { x: 250, y: 0, w: SIZE, h: SIZE, dy: 0, rotation: 0, isGrounded: true, mode: 'cube', gravityDir: 1, color1: '#FF00FF', color2: '#00FFFF' };

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if(gameState === 'menu' || gameState === 'iconKit') drawMenuBackground();
            if(gameState === 'editor') drawEditor();
            if(gameState === 'paused') draw();
        }
        window.addEventListener('resize', resize); resize();

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            editorText.classList.add('hidden');
            if (screens[screenName]) screens[screenName].classList.remove('hidden');
            if (screenName === 'editor') editorText.classList.remove('hidden');
            if (screenName === 'game' || screenName === 'pause') screens.game.classList.remove('hidden');
        }

        document.getElementById('btnPlayMain').addEventListener('click', () => { playingCustom = false; startGame(true); });
        document.getElementById('btnEditor').addEventListener('click', () => { gameState = 'editor'; switchScreen('editor'); drawEditor(); });
        document.getElementById('btnIconKit').addEventListener('click', () => { gameState = 'iconKit'; switchScreen('iconKit'); });
        document.getElementById('btnBackFromIcons').addEventListener('click', () => { player.color1 = document.getElementById('color1').value; player.color2 = document.getElementById('color2').value; gameState = 'menu'; switchScreen('menu'); });
        document.getElementById('toolQuit').addEventListener('click', () => { gameState = 'menu'; switchScreen('menu'); });
        document.getElementById('toolPlay').addEventListener('click', () => { playingCustom = true; startGame(true); });

        // --- NEW CODE LOAD/SAVE SYSTEM ---
        document.getElementById('toolSave').addEventListener('click', () => {
            let encodedData = btoa(JSON.stringify(customLevelData));
            levelCodeTitle.innerText = "SAVE LEVEL";
            levelCodeInput.value = encodedData;
            levelCodeInput.readOnly = true;
            btnConfirmLoad.style.display = 'none';
            btnCopyCode.style.display = 'inline-block';
            levelCodeUI.classList.remove('hidden');
        });

        document.getElementById('toolLoad').addEventListener('click', () => {
            levelCodeTitle.innerText = "LOAD LEVEL";
            levelCodeInput.value = "";
            levelCodeInput.readOnly = false;
            levelCodeInput.placeholder = "Paste your level code here...";
            btnConfirmLoad.style.display = 'inline-block';
            btnCopyCode.style.display = 'none';
            levelCodeUI.classList.remove('hidden');
        });

        document.getElementById('btnCloseCodeUI').addEventListener('click', () => {
            levelCodeUI.classList.add('hidden');
        });

        btnCopyCode.addEventListener('click', () => {
            levelCodeInput.select();
            document.execCommand('copy');
            alert("Level Code copied to clipboard!");
        });

        btnConfirmLoad.addEventListener('click', () => {
            try {
                let decodedData = JSON.parse(atob(levelCodeInput.value.trim()));
                if(Array.isArray(decodedData)) {
                    customLevelData = decodedData;
                    levelCodeUI.classList.add('hidden');
                    alert("Level Loaded successfully!");
                } else {
                    alert("Invalid level data format!");
                }
            } catch (e) {
                alert("Invalid or broken level code!");
            }
        });

        document.getElementById('toolClear').addEventListener('click', () => {
            if (confirm('Are you sure you want to clear your entire level?')) {
                customLevelData = [];
            }
        });

        document.getElementById('btnResume').addEventListener('click', () => { 
            gameState = 'playing'; switchScreen('game'); gameLoop(); 
        });
        document.getElementById('btnQuitFromPause').addEventListener('click', () => { 
            gameState = 'menu'; switchScreen('menu'); cancelAnimationFrame(animationId); 
        });

        const btnNoclip = document.getElementById('btnHackNoclip');
        btnNoclip.addEventListener('click', () => {
            hacks.noclip = !hacks.noclip;
            btnNoclip.innerText = `Noclip: ${hacks.noclip ? 'ON' : 'OFF'}`;
            btnNoclip.style.background = hacks.noclip ? '#00FF00' : '#444';
            btnNoclip.style.color = hacks.noclip ? '#000' : '#fff';
        });

        const btnSlowmo = document.getElementById('btnHackSlowmo');
        btnSlowmo.addEventListener('click', () => {
            hacks.slowmo = !hacks.slowmo;
            btnSlowmo.innerText = `Slowmo: ${hacks.slowmo ? 'ON' : 'OFF'}`;
            btnSlowmo.style.background = hacks.slowmo ? '#00FF00' : '#444';
            btnSlowmo.style.color = hacks.slowmo ? '#000' : '#fff';
        });

        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTool = e.target.getAttribute('data-tool');
            });
        });
        
        function rotateTool() { currentRotation = (currentRotation + 90) % 360; rotateBtn.innerText = `Rotate: ${currentRotation}°`; }
        rotateBtn.addEventListener('click', rotateTool);

        function handleInputStart() {
            if (levelCodeUI.classList.contains('hidden') === false) return;
            isHolding = true;
            jumpBufferFrames = 8; 

            if (gameState !== 'playing') return;
            if (gameOver || levelComplete) {
                if (levelComplete) { gameState = 'menu'; switchScreen('menu'); } 
                else { attempts++; startGame(false); }
                return;
            }

            let triggeredOrb = false;
            for (let obs of activeObstacles) {
                if (obs.type === 'orb_yellow' && checkCollision(player, obs)) {
                    player.dy = -16.5 * player.gravityDir; player.isGrounded = false; triggeredOrb = true; break;
                }
                else if (obs.type === 'orb_pink' && checkCollision(player, obs)) {
                    player.dy = -12.5 * player.gravityDir; player.isGrounded = false; triggeredOrb = true; break;
                }
            }

            if (!triggeredOrb) {
                if (player.mode === 'cube' && player.isGrounded) {
                    player.dy = -16.5 * player.gravityDir; player.isGrounded = false; jumpBufferFrames = 0;
                } else if (player.mode === 'ball' && player.isGrounded) {
                    player.gravityDir *= -1; player.dy = 0; player.isGrounded = false; jumpBufferFrames = 0;
                } else if (player.mode === 'ufo') {
                    player.dy = -11.5 * player.gravityDir; player.isGrounded = false; jumpBufferFrames = 0;
                }
            }
        }
        function handleInputEnd() { isHolding = false; }

        window.addEventListener('keydown', (e) => {
            if (levelCodeUI.classList.contains('hidden') === false) return; // Ignore keys if menu is open
            keys[e.code] = true;
            if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) handleInputStart();
            if (e.code === 'KeyR' && gameState === 'editor') rotateTool();
            
            if (e.code === 'Escape') {
                if (gameState === 'playing') {
                    gameState = 'paused'; switchScreen('pause'); cancelAnimationFrame(animationId); draw();
                } else if (gameState === 'paused') {
                    gameState = 'playing'; switchScreen('game'); gameLoop();
                }
            }
        });
        window.addEventListener('keyup', (e) => { 
            keys[e.code] = false; 
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') handleInputEnd();
        });
        window.addEventListener('mousedown', (e) => {
            if (levelCodeUI.classList.contains('hidden') === false) return;
            if (gameState === 'playing') handleInputStart();
            if (gameState === 'editor' && e.clientY > 160) handleEditorClick(e);
        });
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchstart', (e) => { if(gameState === 'playing' && levelCodeUI.classList.contains('hidden')) handleInputStart(); });
        window.addEventListener('touchend', handleInputEnd);

        function generateCampaignLevel() {
            let ops = []; let currentX = 1000; const baseY = canvas.height - FLOOR_HEIGHT;
            const chunkTypes = [
                [{t: 'block', dx: 0, dy: 1}, {t: 'spike', dx: 1, dy: 1}, {t: 'block', dx: 2, dy: 1}],
                [{t: 'block', dx: 0, dy: 1}, {t: 'spike', dx: 1, dy: 1}, {t: 'spike', dx: 2, dy: 1}, {t: 'block', dx: 3, dy: 1}],
                [{t: 'pad_pink', dx: 0, dy: 1}, {t: 'block', dx: 3, dy: 3}, {t: 'spike', dx: 3, dy: 4}, {t: 'orb_pink', dx: 6, dy: 5}, {t: 'block', dx: 9, dy: 4}, {t: 'coin', dx: 6, dy: 6.5}],
                [{t: 'block', dx: 0, dy: 1}, {t: 'block', dx: 0, dy: 6}, {t: 'portal_ship', dx: 1, dy: 2}, {t: 'block', dx: 1, dy: 1}, {t: 'block', dx: 1, dy: 6}, {t: 'block', dx: 7, dy: 2}, {t: 'spike', dx: 7, dy: 3}, {t: 'block', dx: 7, dy: 6}, {t: 'block', dx: 12, dy: 3}, {t: 'block', dx: 12, dy: 5}, {t: 'portal_cube', dx: 17, dy: 2}, {t: 'block', dx: 17, dy: 1}, {t: 'block', dx: 17, dy: 6}],
                [{t: 'block', dx: 0, dy: 1}, {t: 'block', dx: 0, dy: 6}, {t: 'portal_ufo', dx: 1, dy: 2}, {t: 'block', dx: 1, dy: 1}, {t: 'block', dx: 1, dy: 6}, {t: 'spike', dx: 6, dy: 1}, {t: 'spike', dx: 6, dy: 5, rot: 180}, {t: 'coin', dx: 6, dy: 3}, {t: 'block', dx: 11, dy: 3}, {t: 'portal_cube', dx: 16, dy: 2}, {t: 'block', dx: 16, dy: 1}, {t: 'block', dx: 16, dy: 6}],
                [{t: 'block', dx: 0, dy: 1}, {t: 'block', dx: 0, dy: 7}, {t: 'portal_wave', dx: 1, dy: 3}, {t: 'block', dx: 1, dy: 1}, {t: 'block', dx: 1, dy: 7}, {t: 'block', dx: 6, dy: 2}, {t: 'block', dx: 6, dy: 6}, {t: 'block', dx: 11, dy: 4}, {t: 'portal_cube', dx: 17, dy: 2}, {t: 'block', dx: 17, dy: 1}, {t: 'block', dx: 17, dy: 7}],
                [{t: 'speed_fast', dx: 0, dy: 2}, {t: 'block', dx: 4, dy: 1}, {t: 'spike', dx: 5, dy: 1}, {t: 'spike', dx: 6, dy: 1}, {t: 'block', dx: 7, dy: 1}, {t: 'speed_normal', dx: 14, dy: 2}],
                [{t: 'portal_grav_up', dx: 0, dy: 2}, {t: 'spike', dx: 5, dy: 10, rot: 180}, {t: 'block', dx: 5, dy: 11}, {t: 'spike', dx: 6, dy: 10, rot: 180}, {t: 'block', dx: 6, dy: 11}, {t: 'portal_grav_down', dx: 10, dy: 8}]
            ];

            while (currentX < LEVEL_PIXEL_LENGTH) {
                let chunk = chunkTypes[Math.floor(Math.random() * chunkTypes.length)];
                chunk.forEach(item => {
                    let w = (item.t.startsWith('portal') || item.t.startsWith('speed')) ? 40 : item.t.startsWith('orb_') || item.t === 'coin' ? 40 : SIZE;
                    let h = (item.t.startsWith('portal') || item.t.startsWith('speed')) ? 150 : item.t.startsWith('orb_') || item.t === 'coin' ? 40 : item.t.startsWith('pad_') ? 12 : SIZE;
                    ops.push({ type: item.t, x: currentX + (item.dx * SIZE), y: baseY - (item.dy * SIZE), w: w, h: h, rotation: item.rot || 0, collected: false });
                });
                let maxDx = Math.max(...chunk.map(i => i.dx));
                currentX += (maxDx * SIZE) + 600 + (Math.random() * 400); 
            }
            ops.push({ type: 'finish', x: LEVEL_PIXEL_LENGTH, y: baseY - SIZE*11, w: SIZE*2, h: SIZE*11, rotation: 0 });
            return ops;
        }

        function startGame(fullReset = false) {
            gameState = 'playing'; switchScreen('game');
            if (fullReset) { attempts = 1; coinsCollected = 0; }

            player.y = canvas.height - FLOOR_HEIGHT - SIZE;
            player.dy = 0; player.rotation = 0; player.isGrounded = true; 
            player.mode = 'cube'; player.gravityDir = 1;
            GAME_SPEED = 11; distance = 0; gameOver = false; levelComplete = false; 
            bgOffset = 0; screenShake = 0; particles = []; trailParticles = [];
            attemptDisplay.innerText = `Attempt ${attempts}`;
            coinDisplay.innerText = `Coins: ${coinsCollected}`;

            if (playingCustom) {
                activeObstacles = customLevelData.map(obs => {
                    let w = (obs.type.startsWith('portal') || obs.type.startsWith('speed')) ? 40 : obs.type.startsWith('orb_') || obs.type === 'coin' ? 40 : SIZE;
                    let h = (obs.type.startsWith('portal') || obs.type.startsWith('speed')) ? 150 : obs.type.startsWith('orb_') || obs.type === 'coin' ? 40 : obs.type.startsWith('pad_') ? 12 : SIZE;
                    let yOffset = obs.type.startsWith('pad_') ? (SIZE - 12) : obs.type.startsWith('orb_') || obs.type === 'coin' ? (SIZE/2 - 20) : 0;
                    return { ...obs, w: w, h: h, y: (canvas.height - FLOOR_HEIGHT) - (SIZE * obs.gridY) - (h - SIZE) + yOffset, collected: false };
                });
                let lastX = Math.max(1000, ...customLevelData.map(o => o.x)) + 500;
                if (activeObstacles.length === 0) lastX = 1000;
                activeObstacles.push({ type: 'finish', x: lastX, y: canvas.height - FLOOR_HEIGHT - SIZE*11, w: SIZE*2, h: SIZE*11, rotation: 0 });
            } else {
                activeObstacles = generateCampaignLevel();
            }

            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function triggerDeath() {
            if (gameOver || hacks.noclip) return;
            gameOver = true; screenShake = 25; 
            for(let i=0; i<80; i++) {
                particles.push({
                    x: player.x + player.w/2, y: player.y + player.h/2,
                    dx: (Math.random() - 0.5) * 45, dy: (Math.random() - 0.5) * 45,
                    size: Math.random() * 12 + 4, color: Math.random() > 0.5 ? player.color1 : player.color2, life: 1.0
                });
            }
        }

        function handleEditorClick(e) {
            let worldX = e.clientX + editorCameraX; let gridX = Math.floor(worldX / SIZE) * SIZE;
            let groundY = canvas.height - FLOOR_HEIGHT; let distFromGround = groundY - e.clientY;
            let gridY = Math.ceil(distFromGround / SIZE);

            if (gridY < 1) return;
            customLevelData = customLevelData.filter(obs => !(obs.x === gridX && obs.gridY === gridY));

            if (currentTool !== 'eraser') customLevelData.push({ type: currentTool, x: gridX, gridY: gridY, rotation: currentRotation });
            drawEditor();
        }

        function drawEditor() {
            if (gameState !== 'editor') return;

            let panSpeed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 75 : 25;
            if (keys['ArrowRight'] && levelCodeUI.classList.contains('hidden')) editorCameraX += panSpeed;
            if (keys['ArrowLeft'] && levelCodeUI.classList.contains('hidden')) editorCameraX = Math.max(0, editorCameraX - panSpeed);

            ctx.fillStyle = '#1a2a6c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#112953'; ctx.fillRect(0, canvas.height - FLOOR_HEIGHT, canvas.width, FLOOR_HEIGHT);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, canvas.height - FLOOR_HEIGHT, canvas.width, 3);
            
            let ceilingY = canvas.height - FLOOR_HEIGHT - (SIZE * 11);
            ctx.fillStyle = 'rgba(255,0,0,0.2)'; ctx.fillRect(0, ceilingY, canvas.width, 3);

            ctx.save(); ctx.translate(-editorCameraX, 0);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
            let startCol = Math.floor(editorCameraX / SIZE);
            let endCol = startCol + Math.ceil(canvas.width / SIZE) + 1;
            
            for(let i = startCol; i < endCol; i++) {
                ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height - FLOOR_HEIGHT); ctx.stroke();
            }
            for(let j = 1; j <= 11; j++) {
                let y = canvas.height - FLOOR_HEIGHT - (j * SIZE);
                ctx.beginPath(); ctx.moveTo(editorCameraX, y); ctx.lineTo(editorCameraX + canvas.width, y); ctx.stroke();
            }

            let groundY = canvas.height - FLOOR_HEIGHT;
            customLevelData.forEach(obs => {
                let drawY = groundY - (SIZE * obs.gridY);
                let w = (obs.type.startsWith('portal') || obs.type.startsWith('speed')) ? 40 : obs.type.startsWith('orb_') || obs.type === 'coin' ? 40 : SIZE;
                let h = (obs.type.startsWith('portal') || obs.type.startsWith('speed')) ? 150 : obs.type.startsWith('orb_') || obs.type === 'coin' ? 40 : obs.type.startsWith('pad_') ? 12 : SIZE;
                
                if(obs.type.startsWith('portal') || obs.type.startsWith('speed')) drawY -= (150 - SIZE); 
                if(obs.type.startsWith('pad_')) drawY += (SIZE - 12);
                if(obs.type.startsWith('orb_') || obs.type === 'coin') drawY += (SIZE/2 - 20);

                ctx.save(); ctx.translate(obs.x + w/2, drawY + h/2); ctx.rotate((obs.rotation || 0) * Math.PI / 180);

                if (obs.type === 'spike') {
                    ctx.fillStyle = '#111'; ctx.beginPath();
                    ctx.moveTo(0, -h/2); ctx.lineTo(w/2, h/2); ctx.lineTo(-w/2, h/2);
                    ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.closePath(); ctx.stroke();
                } else if (obs.type.startsWith('portal')) {
                    let color = obs.type === 'portal_cube' ? '#00FF00' : obs.type === 'portal_ship' ? '#FF00FF' : obs.type === 'portal_ball' ? '#FFA500' : obs.type === 'portal_ufo' ? '#FF8800' : obs.type === 'portal_grav_up' ? '#FFEB3B' : obs.type === 'portal_grav_down' ? '#0088FF' : '#00FFFF';
                    ctx.strokeStyle = color; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2); ctx.stroke();
                } else if (obs.type.startsWith('speed_')) {
                    ctx.strokeStyle = obs.type === 'speed_fast' ? '#E91E63' : '#4CAF50'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2); ctx.stroke();
                } else if (obs.type === 'orb_yellow') {
                    ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.strokeStyle = '#FFEB3B'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 235, 59, 0.4)'; ctx.fill();
                } else if (obs.type === 'orb_pink') {
                    ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.strokeStyle = '#FF66FF'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 102, 255, 0.4)'; ctx.fill();
                } else if (obs.type === 'pad_yellow') {
                    ctx.fillStyle = '#FFEB3B'; ctx.fillRect(-w/2, -h/2, w, h);
                } else if (obs.type === 'pad_pink') {
                    ctx.fillStyle = '#FF66FF'; ctx.fillRect(-w/2, -h/2, w, h);
                } else if (obs.type === 'coin') {
                    ctx.beginPath(); ctx.arc(0, 0, w/2.5, 0, Math.PI*2); ctx.fillStyle = '#FFD700'; ctx.fill();
                    ctx.lineWidth=2; ctx.strokeStyle='#FFF'; ctx.stroke();
                } else {
                    ctx.fillStyle = '#111'; ctx.fillRect(-w/2, -h/2, w, h);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-w/2, -h/2, w, h);
                }
                ctx.restore();
            });
            ctx.restore();
            requestAnimationFrame(drawEditor);
        }

        function checkCollision(r1, r2) {
            let r2X = r2.x, r2Y = r2.y, r2W = r2.w, r2H = r2.h;
            if (r2.type === 'spike') {
                let rot = r2.rotation || 0;
                if (rot === 0)   { r2X += 12; r2W -= 24; r2Y += 18; r2H -= 18; } 
                if (rot === 180) { r2X += 12; r2W -= 24; r2Y += 0;  r2H -= 18; } 
                if (rot === 90)  { r2X += 0;  r2W -= 18; r2Y += 12; r2H -= 24; } 
                if (rot === 270) { r2X += 18; r2W -= 18; r2Y += 12; r2H -= 24; } 
            } else if (r2.type === 'block') {
                r2X += 5; r2W -= 10; r2Y += 5; r2H -= 10; 
            }
            return r1.x + 8 < r2X + r2W && r1.x + r1.w - 8 > r2X && r1.y + 8 < r2Y + r2H && r1.y + r1.h - 8 > r2Y;
        }

        function update() {
            if (levelComplete || gameState !== 'playing') return;

            let actualSpeed = hacks.slowmo ? GAME_SPEED * 0.5 : GAME_SPEED;

            if (gameOver) {
                if (screenShake > 0) screenShake *= 0.85;
                if (screenShake < 0.5) screenShake = 0;
                particles.forEach(p => { p.x += p.dx; p.y += p.dy; p.dy += 1.2; p.size *= 0.95; p.life -= 0.03; });
                return; 
            }

            distance += actualSpeed; bgOffset += actualSpeed * 0.3; 
            let targetDist = playingCustom && activeObstacles.length > 0 ? activeObstacles[activeObstacles.length-1].x : LEVEL_PIXEL_LENGTH;
            let percent = Math.min(100, Math.max(0, Math.floor((distance / targetDist) * 100)));
            progressFill.style.width = `${percent}%`; progressText.innerText = `${percent}%`;

            if (player.isGrounded && (player.mode === 'cube' || player.mode === 'ball')) {
                if (Math.random() > 0.4) {
                    trailParticles.push({
                        x: player.x + Math.random()*player.w, y: player.gravityDir === 1 ? player.y + player.h : player.y,
                        size: Math.random() * 5 + 3, life: 1, dx: Math.random() * -3 - 1, dy: (Math.random() - 0.5) * 2
                    });
                }
            } else if (player.mode === 'ship' || player.mode === 'wave' || player.mode === 'ufo') {
                let yPos = player.y + player.h/2;
                if (player.mode !== 'wave') yPos += (Math.random()-0.5)*15;
                trailParticles.push({ x: player.x, y: yPos, size: player.mode === 'wave' ? 12 : 15, life: 1, dx: -1, dy: 0 });
            }

            for(let i = trailParticles.length - 1; i >= 0; i--) {
                let p = trailParticles[i];
                p.x += p.dx - actualSpeed; p.y += p.dy; p.life -= 0.05;
                if (p.life <= 0) trailParticles.splice(i, 1);
            }

            if (jumpBufferFrames > 0) jumpBufferFrames--;
            if (jumpBufferFrames > 0 && player.isGrounded) {
                if (player.mode === 'cube') {
                    player.dy = -16.5 * player.gravityDir; player.isGrounded = false; jumpBufferFrames = 0;
                } else if (player.mode === 'ball') {
                    player.gravityDir *= -1; player.dy = 0; player.isGrounded = false; jumpBufferFrames = 0;
                }
            }

            if (isHolding && player.mode === 'cube' && player.isGrounded) {
                player.dy = -16.5 * player.gravityDir; player.isGrounded = false;
            }

            if (player.mode === 'cube') {
                player.dy += 1.2 * player.gravityDir; 
                if (!player.isGrounded) player.rotation += 0.12 * (actualSpeed/11) * player.gravityDir;
            } 
            else if (player.mode === 'ship') {
                player.rotation = player.dy * 0.05; 
                if (isHolding) player.dy -= 0.35 * player.gravityDir;
                player.dy += 0.20 * player.gravityDir;
                player.dy = Math.max(-7, Math.min(player.dy, 7));
            } 
            else if (player.mode === 'ufo') {
                player.rotation = player.dy * 0.02;
                player.dy += 0.9 * player.gravityDir;
                player.dy = Math.max(-16, Math.min(player.dy, 14));
            }
            else if (player.mode === 'ball') {
                player.dy += 1.3 * player.gravityDir;
                if (!player.isGrounded) player.rotation += 0.2 * (actualSpeed/11) * player.gravityDir;
            } 
            else if (player.mode === 'wave') {
                player.rotation = (isHolding ? -0.7 : 0.7) * player.gravityDir; 
                player.dy = (isHolding ? -9.5 : 9.5) * player.gravityDir; 
            }

            if(hacks.slowmo) { player.y += (player.dy * 0.5); } else { player.y += player.dy; }

            let floorY = canvas.height - FLOOR_HEIGHT - player.h;
            let ceilingY = canvas.height - FLOOR_HEIGHT - (SIZE * 11);

            if (player.y >= floorY) {
                player.y = floorY; 
                if (player.gravityDir === 1) { 
                    player.dy = 0; player.isGrounded = true; 
                    if(player.mode !== 'ship' && player.mode !== 'ufo') player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                }
                if (player.mode === 'wave' && player.gravityDir === 1) triggerDeath(); 
            } else { player.isGrounded = false; }

            if (player.y <= ceilingY) {
                player.y = ceilingY;
                if (player.gravityDir === -1) { 
                    player.dy = 0; player.isGrounded = true; 
                    if(player.mode !== 'ship' && player.mode !== 'ufo') player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                } else if (player.dy < 0) {
                    player.dy = 0;
                }
                if (player.mode === 'wave' && player.gravityDir === -1) triggerDeath();
            }

            for (let i = 0; i < activeObstacles.length; i++) {
                let obs = activeObstacles[i];
                obs.x -= actualSpeed;

                if (checkCollision(player, obs)) {
                    if (obs.type === 'finish') levelComplete = true;
                    else if (obs.type === 'spike') triggerDeath();
                    else if (obs.type === 'pad_yellow') { player.dy = -21 * player.gravityDir; player.isGrounded = false; screenShake = 5; }
                    else if (obs.type === 'pad_pink') { player.dy = -15 * player.gravityDir; player.isGrounded = false; screenShake = 3; }
                    else if (obs.type === 'speed_normal') GAME_SPEED = 11;
                    else if (obs.type === 'speed_fast') GAME_SPEED = 17;
                    else if (obs.type === 'coin' && !obs.collected) { obs.collected = true; coinsCollected++; coinDisplay.innerText = `Coins: ${coinsCollected}`; }
                    else if (obs.type.startsWith('portal_')) {
                        if (obs.type === 'portal_grav_up') { player.gravityDir = -1; }
                        else if (obs.type === 'portal_grav_down') { player.gravityDir = 1; }
                        else {
                            let newMode = obs.type.replace('portal_', '');
                            if (player.mode !== newMode) { player.mode = newMode; }
                        }
                    } 
                    else if (obs.type === 'block') {
                        let stepY = hacks.slowmo ? (player.dy*0.5) : player.dy;
                        let pBottom = player.y + player.h - stepY;
                        let pTop = player.y - stepY;
                        
                        if (player.gravityDir === 1 && player.dy > 0 && pBottom <= obs.y + 20) {
                            player.y = obs.y - player.h; player.dy = 0; player.isGrounded = true;
                            if(player.mode !== 'ship' && player.mode !== 'wave' && player.mode !== 'ufo') player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                        } 
                        else if (player.gravityDir === -1 && player.dy < 0 && pTop >= obs.y + obs.h - 20) {
                            player.y = obs.y + obs.h; player.dy = 0; player.isGrounded = true;
                            if(player.mode !== 'ship' && player.mode !== 'wave' && player.mode !== 'ufo') player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                        }
                        else { 
                            triggerDeath(); 
                        }
                    }
                }
            }

            if (activeObstacles.length > 0 && activeObstacles[0].x < -200) activeObstacles.shift();
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

            ctx.fillStyle = '#1a2a6c'; ctx.fillRect(-20, -20, canvas.width+40, canvas.height+40);
            ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 2;
            for(let i = -50; i < canvas.width + 50; i += 120) { 
                ctx.beginPath(); ctx.moveTo((i - bgOffset % 120), -50); ctx.lineTo((i - bgOffset % 120), canvas.height); ctx.stroke();
            }

            ctx.fillStyle = '#112953'; ctx.fillRect(-20, canvas.height - FLOOR_HEIGHT, canvas.width+40, FLOOR_HEIGHT+20);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(-20, canvas.height - FLOOR_HEIGHT, canvas.width+40, 4);

            let ceilingY = canvas.height - FLOOR_HEIGHT - (SIZE * 11);
            ctx.fillStyle = 'rgba(255,0,0,0.15)'; ctx.fillRect(-20, ceilingY, canvas.width+40, 4);
            
            trailParticles.forEach(p => {
                ctx.fillStyle = player.mode === 'wave' ? player.color2 : `rgba(255, 255, 255, ${p.life})`;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            activeObstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x + obs.w/2, obs.y + obs.h/2);
                ctx.rotate((obs.rotation || 0) * Math.PI / 180);

                if (obs.type === 'spike') {
                    ctx.fillStyle = '#111'; ctx.beginPath();
                    ctx.moveTo(0, -obs.h/2); ctx.lineTo(obs.w/2, obs.h/2); ctx.lineTo(-obs.w/2, obs.h/2);
                    ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.closePath(); ctx.stroke();
                } else if (obs.type === 'block') {
                    ctx.fillStyle = '#111'; ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                } else if (obs.type === 'pad_yellow') {
                    ctx.fillStyle = '#FFEB3B'; ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                } else if (obs.type === 'pad_pink') {
                    ctx.fillStyle = '#FF66FF'; ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                } else if (obs.type === 'orb_yellow') {
                    ctx.beginPath(); ctx.arc(0, 0, obs.w/2, 0, Math.PI*2); ctx.strokeStyle = '#FFEB3B'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 235, 59, 0.4)'; ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, obs.w/6, 0, Math.PI*2); ctx.fill();
                } else if (obs.type === 'orb_pink') {
                    ctx.beginPath(); ctx.arc(0, 0, obs.w/2, 0, Math.PI*2); ctx.strokeStyle = '#FF66FF'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 102, 255, 0.4)'; ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, obs.w/6, 0, Math.PI*2); ctx.fill();
                } else if (obs.type === 'coin' && !obs.collected) {
                    ctx.beginPath(); ctx.arc(0, 0, obs.w/2.5, 0, Math.PI*2); ctx.fillStyle = '#FFD700'; ctx.fill();
                    ctx.lineWidth=2; ctx.strokeStyle='#FFF'; ctx.stroke();
                    ctx.fillStyle = '#DAA520'; ctx.beginPath(); ctx.arc(0, 0, obs.w/4, 0, Math.PI*2); ctx.fill();
                } else if (obs.type === 'finish') {
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.3)'; ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                } else if (obs.type.startsWith('portal_')) {
                    let color = obs.type === 'portal_cube' ? '#00FF00' : obs.type === 'portal_ship' ? '#FF00FF' : obs.type === 'portal_ball' ? '#FFA500' : obs.type === 'portal_ufo' ? '#FF8800' : obs.type === 'portal_grav_up' ? '#FFEB3B' : obs.type === 'portal_grav_down' ? '#0088FF' : '#00FFFF';
                    ctx.strokeStyle = color; ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.ellipse(0, 0, obs.w/2, obs.h/2, 0, 0, Math.PI*2); ctx.stroke();
                } else if (obs.type.startsWith('speed_')) {
                    let color = obs.type === 'speed_fast' ? '#E91E63' : '#4CAF50';
                    ctx.strokeStyle = color; ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.ellipse(0, 0, obs.w/2, obs.h/2, 0, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = 'white'; ctx.font = '24px Righteous'; ctx.textAlign = 'center';
                    ctx.fillText(obs.type === 'speed_fast' ? '>>' : '>', 0, 8);
                }
                ctx.restore();
            });

            if (!gameOver || hacks.noclip) {
                ctx.save();
                ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
                ctx.scale(1, player.gravityDir);
                ctx.rotate(player.rotation);

                if (hacks.noclip) ctx.globalAlpha = 0.5;

                if (player.mode === 'cube') {
                    ctx.fillStyle = player.color1; ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
                    ctx.fillStyle = player.color2; ctx.fillRect(-player.w/4, -player.h/4, player.w/2, player.h/2);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-player.w/2, -player.h/2, player.w, player.h);
                } 
                else if (player.mode === 'ship') {
                    ctx.fillStyle = player.color1; ctx.beginPath(); ctx.moveTo(-25, -12); ctx.lineTo(25, 0); ctx.lineTo(-25, 12); ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = player.color2; ctx.fillRect(-15, -6, 12, 12);
                }
                else if (player.mode === 'ufo') {
                    ctx.fillStyle = player.color1; ctx.beginPath(); ctx.ellipse(0, 6, player.w/1.6, player.h/3, 0, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = player.color2; ctx.beginPath(); ctx.arc(0, 0, player.w/2.5, Math.PI, 0); ctx.fill(); ctx.stroke();
                }
                else if (player.mode === 'ball') {
                    ctx.fillStyle = player.color1; ctx.beginPath(); ctx.arc(0, 0, player.w/2, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = player.color2; ctx.beginPath(); ctx.arc(0, 0, player.w/3.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.fillRect(-2, -player.w/2, 4, player.w);
                }
                else if (player.mode === 'wave') {
                    ctx.fillStyle = player.color1; ctx.beginPath(); ctx.moveTo(25, 0); ctx.lineTo(-25, -20); ctx.lineTo(-12, 0); ctx.lineTo(-25, 20); ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = player.color2; ctx.beginPath(); ctx.arc(-6, 0, 6, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;
                ctx.restore();
            }

            particles.forEach(p => {
                if(p.life > 0) { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
            });
            ctx.globalAlpha = 1.0;
            ctx.restore();

            if (gameOver || levelComplete) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = levelComplete ? '#00FF00' : 'white';
                ctx.font = '70px Righteous'; ctx.textAlign = 'center';
                ctx.fillText(levelComplete ? 'LEVEL COMPLETE!' : 'CRASHED!', canvas.width / 2, canvas.height / 2);
                ctx.font = '28px Righteous'; ctx.fillStyle = 'white';
                ctx.fillText('Click or W/Space/Up to retry', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function gameLoop() {
            update(); draw();
            if (gameState === 'playing') animationId = requestAnimationFrame(gameLoop);
        }

        function drawMenuBackground() { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    </script>
